<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e53935">
<title>Fichaje Volta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700;800&display=swap">
<style>
/* Identidad Volta Baterías: cabecera roja con la marca, fondo claro neutro, titulares Roboto Condensed en mayúsculas, botones en píldora. */
:root{
  --brand:#e53935;      /* brand-600 */
  --brand-500:#ef4640;
  --bg:#f6f6f6;         /* carbon-50 */
  --panel:#ffffff;
  --line:#dbdbdb;       /* carbon-200 */
  --fg:#121212;         /* carbon-950 */
  --muted:#6e6e6e;      /* carbon-500 */
  --in:#059669;         /* entrada */
  --out:#e53935;        /* salida = rojo de marca */
  --warn:#f9ab00;
  --display:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
header{background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logo .ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#fff;color:var(--brand)}
.logo .ico svg{width:24px;height:24px}
.logo .wm{font:700 24px/1 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.logo .wm small{display:block;font:600 10px var(--body);letter-spacing:.28em;opacity:.85;margin-top:3px}
.hdr-right{text-align:right}
.clock{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.date{font-size:14px;opacity:.9;text-transform:capitalize;margin-top:2px}
.body{flex:1;display:flex;flex-direction:column;min-height:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 env(safe-area-inset-bottom,0px)}
.hint{color:var(--muted);font-size:clamp(14px,2vh,17px);padding-block:clamp(6px,1.5vh,14px) 4px;font-weight:500}
/* La rejilla se calcula en JS (columnas × filas) para que todos los nombres quepan sin desplazamiento */
.grid{flex:1;display:grid;grid-auto-rows:1fr;gap:clamp(8px,1.4vw,14px);padding-block:4px 10px;overflow:hidden;min-height:0}
.who{appearance:none;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--fg);font:700 clamp(18px,min(5.5vh,3.4vw),34px)/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;min-width:0;min-height:0;overflow:hidden;box-shadow:0 1px 2px rgba(18,18,18,.05),0 8px 24px -8px rgba(18,18,18,.08)}
.who small{font:500 13.5px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.who:active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 1px rgba(229,57,53,.22),0 8px 40px -8px rgba(229,57,53,.35)}
.who:active small{color:#fff}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:4px 8px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;background:var(--panel);border:1px solid var(--line);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:var(--in)}
.dot.off{background:var(--out)}
.dot.queue{background:var(--warn)}

/* cámara */
.cam-wrap{flex:1;display:grid;grid-template-columns:1fr minmax(260px,380px);gap:20px;padding-block:16px;min-height:0}
.viewfinder{position:relative;background:#121212;border-radius:24px;overflow:hidden;border:1px solid var(--line);min-height:0}
.viewfinder video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.viewfinder .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#dadce0;font-size:20px;background:#121212}
.viewfinder.nocam .msg{display:flex}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.name{font:700 44px/1 var(--display);text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:16px;font-weight:500}
.big{appearance:none;border:0;border-radius:999px;color:#fff;font:700 32px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;padding:22px 16px;cursor:pointer;flex:1;min-height:92px;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .15s}
.big.in{background:var(--in)}
.big.out{background:var(--out);box-shadow:0 0 0 1px rgba(229,57,53,.22),0 8px 40px -8px rgba(229,57,53,.35)}
.big:disabled{opacity:.4;cursor:default;box-shadow:none}
.big:active{transform:scale(.98);filter:brightness(1.08)}
.ghost{appearance:none;background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:999px;font:600 16px var(--body);padding:13px;cursor:pointer}
.ghost:active{border-color:var(--brand);color:var(--brand)}
.suggest{font-size:14.5px;color:var(--muted)}
.suggest b{color:var(--fg)}

/* PIN */
.pinbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;flex:1}
.pindots{display:flex;gap:16px;height:24px}
.pindots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.pindots i.on{background:var(--brand);border-color:var(--brand)}
.pindots.err i{border-color:var(--out)}
.keys{display:grid;grid-template-columns:repeat(3,88px);gap:12px}
.keys button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;font:600 30px var(--display);height:72px;cursor:pointer}
.keys button:active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* confirmación */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.done img{width:min(40vh,320px);aspect-ratio:4/3;object-fit:cover;border-radius:24px;border:1px solid var(--line);max-width:100%;background:#121212}
.done .tag{font:700 64px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.done .tag.in{color:var(--in)}
.done .tag.out{color:var(--out)}
.done .when{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.done .note{color:var(--muted);font-size:16px;max-width:48ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#121212;color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
/* salvapantallas negro: la pantalla sigue encendida, un toque la quita */
.saver{position:fixed;inset:0;z-index:50;background:#000;display:none;cursor:pointer;touch-action:none}
.saver.show{display:block}
.saver .sv{position:absolute;color:#3a3a3a;text-align:center;transition:top 1s,left 1s;transform:translate(-50%,-50%);pointer-events:none}
.saver .sv b{display:block;font:700 64px/1 var(--display);font-variant-numeric:tabular-nums}
.saver .sv span{font:500 16px var(--body)}
@media (max-width:760px){
  .cam-wrap{grid-template-columns:1fr;grid-template-rows:minmax(200px,1fr) auto}
  .name{font-size:36px}.big{font-size:28px;min-height:76px;padding:16px}
  .clock{font-size:30px}.logo .wm{font-size:20px}
  .who{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){
  .screen.active{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>

<!-- ============ PANTALLA 3: CONFIRMACIÓN ============ -->
<section class="screen" id="s-done">
  <header><a class="logo" aria-label="Volta Baterías"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span><span class="wm">Volta<small>BATERÍAS</small></span></a><div class="hdr-right"><div class="clock" id="clock4">--:--</div></div></header>
  <div class="body"><div class="done" id="donebox">

<div class="toast" id="toast"></div>
<div class="saver" id="saver"><div class="sv" id="sv"><b id="svclock">--:--</b><span id="svhint"></span></div></div>
<canvas id="canvas" hidden></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screens = ["s-home","s-pin","s-cam","s-done"];
  let current = null, stream = null, pinBuf = "", idleTimer = null, doneTimer = null;

  // ---------- reloj ----------
  const fmtTime = d => d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  function tick(){
    const d = new Date();
    ["clock","clock2","clock3","clock4"].forEach(id => $(id).textContent = fmtTime(d));
    $("date").textContent = d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  }
  tick(); setInterval(tick, 10000);

  // ---------- navegación ----------
  function show(id){
    screens.forEach(s => $(s).classList.toggle("active", s===id));
    if (id !== "s-cam") stopCamera();
    resetIdle();
  }
  function resetIdle(){
    clearTimeout(idleTimer);
    const active = document.querySelector(".screen.active")?.id;
    if (active && active !== "s-home") idleTimer = setTimeout(goHome, CONFIG.INACTIVIDAD*1000);
  }
  function goHome(){ clearTimeout(doneTimer); current = null; pinBuf=""; show("s-home"); }
  ["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, resetIdle, {passive:true}));

  // ---------- memoria local (último fichaje por persona) ----------
  const store = {
    get(k, def){ try{ const v = localStorage.getItem(k); return v===null?def:JSON.parse(v);}catch(e){ return def; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  // ---------- rejilla de nombres ----------
  function fitGrid(){
    const g = $("grid"), n = CONFIG.EMPLEADOS.length;
    const w = g.clientWidth || window.innerWidth, hgt = g.clientHeight || window.innerHeight*0.6;
    // Elegir el nº de columnas que deja las celdas más cuadradas posibles (relación ~1.6:1)
    let best = 1, bestScore = Infinity;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), cw = w / c, ch = hgt / r;
      const score = Math.abs(Math.log((cw / ch) / 1.6)) + (c * r - n) * 0.05;
      if (score < bestScore) { bestScore = score; best = c; }
    }
    g.style.gridTemplateColumns = `repeat(${best},1fr)`;
  }
  window.addEventListener("resize", fitGrid);
  function renderGrid(){
    const g = $("grid"); g.innerHTML = ""; fitGrid();
    CONFIG.EMPLEADOS.forEach(e => {
      const b = document.createElement("button");
      b.className = "who"; b.type="button";
      b.innerHTML = `<span>${e.nombre}</span>`;
      b.addEventListener("click", () => pick(e));
      g.appendChild(b);
    });
  }
  function pick(e){
    current = e;
    if (e.pin && e.pin.length) { pinBuf=""; paintPin(); $("pin-name").textContent = e.nombre; show("s-pin"); }
    else openCamera();
  }

  // ---------- PIN ----------
  const keys = $("keys");
  ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k => {
    const b = document.createElement("button"); b.textContent = k; b.type="button";
    b.addEventListener("click", () => {
      if (k==="⌫") pinBuf = pinBuf.slice(0,-1);
      else if (k==="OK") checkPin();
      else if (pinBuf.length<4) pinBuf += k;
      paintPin();
      if (pinBuf.length===4 && k!=="OK") setTimeout(checkPin, 120);
    });
    keys.appendChild(b);
  });
  function paintPin(){ [...$("pindots").children].forEach((d,i)=>d.classList.toggle("on", i<pinBuf.length)); }
  function checkPin(){
    if (pinBuf === current.pin) { $("pindots").classList.remove("err"); openCamera(); }
    else { $("pindots").classList.add("err"); pinBuf=""; paintPin(); toast("PIN incorrecto"); setTimeout(()=>$("pindots").classList.remove("err"), 700); }
  }
  $("pin-cancel").addEventListener("click", goHome);

  // ---------- cámara ----------
  async function openCamera(){
    $("cam-name").textContent = current.nombre;
    $("vf").classList.remove("nocam"); $("cammsg").textContent = "Activando la cámara…";
    $("btn-in").disabled = $("btn-out").disabled = true;
    show("s-cam");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ideal:640}, height:{ideal:480} }, audio:false });
      $("video").srcObject = stream;
      await new Promise(r => { $("video").onloadedmetadata = r; setTimeout(r, 2500); });
      $("btn-in").disabled = $("btn-out").disabled = false;
    } catch (err) {
      // La foto es obligatoria: sin cámara no se puede fichar
      $("vf").classList.add("nocam");
      $("cammsg").textContent = "Sin cámara no se puede fichar. Avisa a un responsable para revisar la tablet.";
      $("btn-in").disabled = $("btn-out").disabled = true;
      stream = null;
    }
  }
  function stopCamera(){
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    $("video").srcObject = null;
  }
  function snapshot(){
    if (!stream) return null;
    const v = $("video"), c = $("canvas");
    const w = 480, h = Math.round(w * (v.videoHeight||3) / (v.videoWidth||4));
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.drawImage(v, 0, 0, w, h);
    // Marca de agua con fecha/hora
    ctx.font = "bold 18px Arial"; ctx.fillStyle="rgba(229,57,53,.85)"; ctx.fillRect(0,h-28,w,28);
    ctx.fillStyle="#fff"; ctx.fillText(new Date().toLocaleString("es-ES"), 10, h-9);
    return c.toDataURL("image/jpeg", 0.72);
  }
  $("btn-in").addEventListener("click", () => fichar("Entrada"));
  $("btn-out").addEventListener("click", () => fichar("Salida"));
  $("btn-cancel").addEventListener("click", goHome);

  // ---------- fichar ----------
  function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2); }
  async function fichar(tipo){
    if (!current) return;
    $("btn-in").disabled = $("btn-out").disabled = true;
    const dataUrl = snapshot();
    if (!dataUrl) { toast("No se ha podido hacer la foto. Inténtalo de nuevo."); $("btn-in").disabled = $("btn-out").disabled = false; return; }
    const now = new Date();
    const rec = {
      uid: uuid(),
      empleado_id: current.id,
      empleado_nombre: current.nombre,
      tipo,
      hora_tablet: now.toISOString(),
      dispositivo: CONFIG.DISPOSITIVO,
      foto: dataUrl.split(",")[1]
    };
    showDone(tipo, current.nombre, now, dataUrl, "Guardando…");
    const ok = await send(rec);
    $("done-note").textContent = ok ? "Fichaje guardado" : "Sin conexión: se guardará automáticamente en cuanto vuelva la red";
    if (!ok) enqueue(rec);
    renderGrid(); updateNet();
  }
  function showDone(tipo, nombre, when, img, note){
    const box = $("donebox"); box.classList.remove("err");
    $("done-img").src = img || ""; $("done-img").hidden = !img;
    const t = $("done-tag"); t.textContent = tipo; t.className = "tag " + (tipo==="Entrada"?"in":"out");
    $("done-name").textContent = nombre;
    $("done-when").textContent = fmtTime(when);
    $("done-note").textContent = note;
    show("s-done");
    clearTimeout(doneTimer);
    doneTimer = setTimeout(goHome, CONFIG.CONFIRMACION*1000);
  }

  // ---------- envío y cola offline ----------
  async function send(rec){
    try {
      const body = new URLSearchParams(rec); // form-urlencoded: sin preflight CORS
      const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 20000);
      const r = await fetch(CONFIG.WEBHOOK_URL, { method:"POST", body, signal: ctrl.signal });
      clearTimeout(to);
      return r.ok;
    } catch (e) { return false; }
  }
  function enqueue(rec){ const q = store.get("queue", []); q.push(rec); store.set("queue", q); }
  async function flush(){
    let q = store.get("queue", []);
    if (!q.length || !navigator.onLine) return;
    const rest = [];
    for (const rec of q) { if (!(await send(rec))) rest.push(rec); }
    store.set("queue", rest); updateNet();
    if (q.length && !rest.length) toast("Fichajes pendientes enviados");
  }
  function updateNet(){
    const q = store.get("queue", []).length;
    const dot = $("netdot"), txt = $("nettxt");
    if (!navigator.onLine) { dot.className="dot off"; txt.textContent = "Sin conexión" + (q?` · ${q} pendiente${q>1?"s":""}`:""); }
    else if (q) { dot.className="dot queue"; txt.textContent = `${q} fichaje${q>1?"s":""} pendiente${q>1?"s":""} de enviar`; }
    else { dot.className="dot"; txt.textContent = "Conectado"; }
    $("lastinfo").textContent = CONFIG.DISPOSITIVO;
  }
  window.addEventListener("online", () => { updateNet(); flush(); });
  window.addEventListener("offline", updateNet);
  setInterval(flush, 30000);

  let toastTimer;
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), 2500); }

  // ---------- pantalla siempre encendida ----------
  // La tablet no puede despertarse tocando la pantalla apagada, así que nunca dejamos que se apague:
  // pedimos el bloqueo de pantalla (Wake Lock) y lo volvemos a pedir si Android lo suelta.
  let lock = null;
  async function wake(){
    if (!("wakeLock" in navigator) || document.hidden || (lock && !lock.released)) return;
    try{ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; setTimeout(wake, 1000); }); }
    catch(e){ lock = null; }
  }
  document.addEventListener("visibilitychange", wake);
  document.addEventListener("pointerdown", wake, {passive:true});
  setInterval(wake, 30000); wake();

  // ---------- salvapantallas negro (un toque lo quita) ----------
  const saver = $("saver"); let saverTimer = null;
  const svText = CONFIG.TOQUES_DESPERTAR > 1 ? "Toca dos veces para fichar" : "Toca la pantalla para fichar";
  $("svhint").textContent = svText;
  function saverOn(){
    if (document.querySelector(".screen.active")?.id !== "s-home") return armSaver();
    $("svclock").textContent = fmtTime(new Date()); moveSaver();
    saver.classList.add("show");
  }
  function moveSaver(){ const sv=$("sv"); sv.style.left = (20+Math.random()*60)+"%"; sv.style.top = (20+Math.random()*60)+"%"; }
  function armSaver(){ clearTimeout(saverTimer); if (CONFIG.SALVAPANTALLAS>0) saverTimer = setTimeout(saverOn, CONFIG.SALVAPANTALLAS*1000); }
  // El toque que quita el salvapantallas no llega a los botones de debajo (no se ficha por error)
  saver.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); }, true);
  let lastTap = 0;
  saver.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); wake();
    const now = Date.now();
    if (CONFIG.TOQUES_DESPERTAR > 1 && now - lastTap > 600) { lastTap = now; $("svhint").textContent = "Toca otra vez"; return; }
    lastTap = 0; $("svhint").textContent = svText; saver.classList.remove("show"); armSaver();
  }, true);
  ["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => { if (!saver.classList.contains("show")) armSaver(); }, {passive:true}));
  setInterval(() => { if (saver.classList.contains("show")) { $("svclock").textContent = fmtTime(new Date()); moveSaver(); } }, 60000);
  armSaver();

  try{ Object.keys(localStorage).filter(k=>k.startsWith("last:")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  renderGrid(); updateNet(); flush();
})();
</script>
